name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecs-role
          role-session-name: GitHubActionsDeploy

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get short commit hash
        run: echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      # Walking skeleton: push a placeholder image to prove the pipeline (OIDC auth, ECR
      # push, terraform apply) works before RDS/Secrets Manager exist. The real app would
      # crash-loop without a database — swapped to a real docker/build-push-action step
      # once RDS/secrets are wired up (next ticket).
      - name: Pull, tag, and push placeholder image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker pull nginx:latest
          docker tag nginx:latest "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
          docker push "$ECR_REGISTRY/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        working-directory: terraform/aws/application
        run: terraform init

      - name: Terraform apply
        working-directory: terraform/aws/application
        run: |
          terraform apply -auto-approve \
            -var="container_image=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"

      - name: Show deployed URL
        working-directory: terraform/aws/application
        run: terraform output -json ingress_paths
