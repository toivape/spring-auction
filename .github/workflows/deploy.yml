name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_mailjet_api_key: ${{ secrets.MAILJET_API_KEY }}
      TF_VAR_mailjet_secret_key: ${{ secrets.MAILJET_SECRET_KEY }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
      TF_VAR_ingestion_api_key: ${{ secrets.INGESTION_API_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecs-role
          role-session-name: GitHubActionsDeploy

      - name: Compute image URI
        run: |
          echo "ECR_REGISTRY=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        working-directory: terraform/aws/application
        run: terraform init

      # Chicken-and-egg: the ECR repo is Terraform-managed but must exist before we can push
      # to it, and the full apply below needs an image to already be pushed (container_image
      # has no default). Targeted apply for just the repo first, full apply after the push.
      - name: Terraform apply (ECR repo only)
        working-directory: terraform/aws/application
        env:
          TF_VAR_container_image: "${{ env.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
        run: terraform apply -auto-approve -target=aws_ecr_repository.app

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Terraform apply
        working-directory: terraform/aws/application
        env:
          TF_VAR_container_image: "${{ env.ECR_REGISTRY }}/${{ vars.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
        run: terraform apply -auto-approve

      - name: Show deployed URL
        working-directory: terraform/aws/application
        run: terraform output -json ingress_paths
