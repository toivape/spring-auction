name: Destroy

# Tears down the application stack (RDS, ECS Express, VPC, ECR, secrets, logs) to stop the
# bill. Leaves bootstrap/ (S3 state + DynamoDB locks) and deploy-role/ (IAM) in place — those
# cost ~nothing and let a later Deploy run work again without re-bootstrapping.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm tearing down the application stack'
        required: true

jobs:
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    # Guard on main too: the backend key points at the one real deployment, so a dispatch
    # from any other branch would still destroy it. Match deploy.yml's branch guard.
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'destroy'
    permissions:
      id-token: write
      contents: read
    env:
      # terraform destroy still evaluates every variable; container_image has no default, so
      # feed it a placeholder — the value is irrelevant when the resource is being removed.
      TF_VAR_container_image: "placeholder:destroy"
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_app_base_url: ${{ vars.APP_BASE_URL }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_mailjet_api_key: ${{ secrets.MAILJET_API_KEY }}
      TF_VAR_mailjet_secret_key: ${{ secrets.MAILJET_SECRET_KEY }}
      TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
      TF_VAR_ingestion_api_key: ${{ secrets.INGESTION_API_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecs-role
          role-session-name: GitHubActionsDestroy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform init
        working-directory: terraform/aws/application
        run: terraform init

      - name: Terraform destroy
        working-directory: terraform/aws/application
        run: terraform destroy -auto-approve
